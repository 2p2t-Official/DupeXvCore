name: DupeXvCore
main: dev.dupexv.core.DupeXvCore
version: ${project.version}
api-version: ${plugin.api.version}
folia-supported: true
softdepend: [LuckPerms, packetevents]
authors: [DupeXv]
website: https://dupexv.org
description: Core plugin for DupeXv.

commands:
  tpa:
    description: Request to teleport to a player.
    aliases: [tpask, call]
    usage: /<command> <player>
  tpa-here:
    description: Request a player to teleport to you.
    aliases: [tpahere, tphere, tpah]
    usage: /<command> <player>
  tpa-cancel:
    description: Cancel a teleport request you sent.
    aliases: [tpacancel, tpcancel, tpac]
    usage: /<command> [player]
  tpa-accept:
    description: Accept a teleport request.
    aliases: [tpaccept, tpyes, tpayes]
    usage: /<command> [player]
  tpa-deny:
    description: Deny a teleport request.
    aliases: [tpadeny, tpdeny, tpno, tpano]
    usage: /<command> [player]
  spawn:
    description: Teleport to spawn.
    usage: /<command>
  home:
    description: Open homes or teleport to one.
    aliases: [homes]
    usage: /<command> [home]
  sethome:
    description: Set a home.
    usage: /<command> <name>
  delhome:
    description: Delete a home.
    usage: /<command> <name>
  invsee:
    description: View a player's inventory.
    aliases: [openinv, ise]
    usage: /<command> <player>
  endersee:
    description: View a player's ender chest.
    aliases: [enderchest, echest]
    usage: /<command> <player>
  invclear:
    description: Clear a player's inventory.
    aliases: [clearinv]
    usage: /<command> <player>
  enderclear:
    description: Clear a player's ender chest.
    aliases: [clearender]
    usage: /<command> <player>
  link:
    description: Link your Minecraft account to dupexv.org.
    usage: /<command>
  msg:
    description: Send a private message to a player.
    aliases: [message, whisper, tell, w, pm]
    usage: /<command> <player> <message>
  r:
    description: Reply to the last private message.
    aliases: [reply]
    usage: /<command> <message>
  ignore:
    description: Manage your ignore list.
    usage: /<command> <add|remove|list> [player]
  unignore:
    description: Remove a player from your ignore list.
    usage: /<command> <player>
  dupexvcore:
    description: Reload the plugin configuration and language files.
    aliases: [xv]
    usage: /<command> <reload>

permissions:
  dupexvcore.tpa:
    description: Use the tpa commands.
    default: true
  dupexvcore.spawn:
    description: Use /spawn.
    default: true
  dupexvcore.home:
    description: Use home commands.
    default: true
  dupexvcore.home.max.2:
    description: Allow 2 homes.
    default: true
  dupexvcore.home.max.3:
    description: Allow 3 homes.
    default: false
  dupexvcore.home.max.4:
    description: Allow 4 homes.
    default: false
  dupexvcore.home.max.5:
    description: Allow 5 homes.
    default: false
  dupexvcore.home.max.6:
    description: Allow 6 homes.
    default: false
  dupexvcore.home.max.7:
    description: Allow 7 homes.
    default: false
  dupexvcore.home.max.8:
    description: Allow 8 homes.
    default: false
  dupexvcore.home.max.9:
    description: Allow 9 homes.
    default: false
  dupexvcore.home.max.10:
    description: Allow 10 homes.
    default: false
  dupexvcore.invsee:
    description: Use /invsee.
    default: op
  dupexvcore.endersee:
    description: Use /endersee.
    default: op
  dupexvcore.invclear:
    description: Use /invclear.
    default: op
  dupexvcore.enderclear:
    description: Use /enderclear.
    default: op
  dupexvcore.link:
    description: Use /link.
    default: true
  dupexvcore.msg:
    description: Use /msg and /r.
    default: true
  dupexvcore.ignore:
    description: Use /ignore and /unignore.
    default: true
  dupexvcore.chat.bypass:
    description: Bypass the chat filter and anti-spam.
    default: op
  dupexvcore.commandwhitelist.bypass:
    description: Bypass the command whitelist.
    default: op
  dupexvcore.admin:
    description: Reload the plugin.
    default: op
